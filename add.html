<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Go-shorter — Add shortlink</title>
    <link rel="stylesheet" href="manage.css" />
    <style>
      .center {
        max-width: 480px;
        margin: 60px auto;
        padding: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .center h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .center .lede {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .center .lede code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg);
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }
      .center form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .center .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .center input[type="url"] {
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        outline: none;
      }
      .center input[type="url"]:focus {
        border-color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="center">
      <h1 id="title">Add a shortlink</h1>
      <p id="lede" class="lede">Pick a name and URL. You'll be able to use it as <code>go/&lt;name&gt;</code>.</p>

      <form id="form">
        <div class="field">
          <label for="name">Name</label>
          <div class="row">
            <span class="prefix">go/</span>
            <input id="name" type="text" autocomplete="off" required />
          </div>
        </div>
        <div class="field">
          <label for="url">URL</label>
          <input id="url" type="url" placeholder="https://example.com" required />
        </div>
        <p id="error" class="error" hidden></p>
        <div class="actions">
          <button type="button" id="cancel">Cancel</button>
          <button type="submit" class="primary" id="save">Save</button>
          <button type="submit" class="primary" id="save-go" formnovalidate>Save & Go</button>
        </div>
      </form>
    </div>

    <script src="lib/storage.js"></script>
    <script src="add.js"></script>
  </body>
</html>
