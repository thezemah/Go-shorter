<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Go-shorter — Add shortlink</title>
    <link rel="stylesheet" href="lib/design.css" />
    <link rel="stylesheet" href="add.css" />
  </head>
  <body>
    <main class="add-page">
      <div class="bg-orb orb-a"></div>
      <div class="bg-orb orb-b"></div>

      <div class="brand top-brand">
        <span class="brand-mark" data-icon="logo"></span>
        <span class="brand-name">Go<span class="accent">-shorter</span></span>
      </div>

      <div class="hero-card">
        <div id="hero-mark" class="hero-mark" data-icon="bolt"></div>
        <h1 id="title" class="hero-title">Add a shortlink</h1>
        <p id="lede" class="hero-lede">
          Pick a name and a URL. You'll be able to use it as <code>go/&lt;name&gt;</code>.
        </p>

        <form id="form" class="form">
          <label class="field">
            Name
            <span class="input-group">
              <span class="prefix">go/</span>
              <input id="name" type="text" autocomplete="off" required />
            </span>
          </label>
          <label class="field">
            Destination URL
            <input id="url" class="input" type="url" placeholder="https://example.com" required />
          </label>
          <p id="error" class="error" hidden></p>
          <div class="actions">
            <button type="button" id="cancel" class="btn">Cancel</button>
            <button type="submit" id="save" class="btn">Save</button>
            <button type="submit" id="save-go" class="btn btn-primary">
              <span data-icon="bolt"></span>Save &amp; go
            </button>
          </div>
        </form>

        <div id="success" class="success-state" hidden>
          <div class="success-mark" data-icon="check"></div>
          <h2>Saved!</h2>
          <p id="success-lede"></p>
          <div class="actions">
            <button type="button" id="success-manage" class="btn">Manage all</button>
            <button type="button" id="success-go" class="btn btn-primary">
              <span data-icon="external"></span>Open now
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="lib/storage.js"></script>
    <script src="lib/ui.js"></script>
    <script src="add.js"></script>
  </body>
</html>
