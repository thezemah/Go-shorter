<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Go-shorter</title>
    <link rel="stylesheet" href="lib/design.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" data-icon="logo"></span>
        <span class="brand-name">Go<span class="accent">-shorter</span></span>
      </div>
      <button id="add-btn" type="button" class="btn btn-primary" title="Add shortlink">
        <span data-icon="plus"></span>
        <span>Add</span>
      </button>
    </header>

    <section id="recent-section" class="recent" hidden>
      <div class="section-head">
        <h2 class="section-title">Recently used</h2>
      </div>
      <ul id="list" class="list" role="list"></ul>
    </section>

    <section id="empty" class="empty-state" hidden>
      <div class="empty-mark" data-icon="bolt"></div>
      <h3>No shortlinks yet</h3>
      <p>Click <strong>Add</strong> to create your first one.</p>
    </section>

    <footer class="footer">
      <button id="open-manage" type="button" class="btn btn-ghost manage-link">
        <span>View all<span id="total"></span></span>
        <span data-icon="arrow"></span>
      </button>
    </footer>

    <script src="lib/storage.js"></script>
    <script src="lib/ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
