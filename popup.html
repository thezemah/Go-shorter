<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Go-shorter</title>
    <link rel="stylesheet" href="lib/design.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" data-icon="logo"></span>
        <span class="brand-name">Go<span class="accent">-shorter</span></span>
      </div>
      <button id="toggle-add" type="button" class="btn btn-primary" title="Add shortlink (N)">
        <span data-icon="plus"></span>
        <span>Add</span>
      </button>
    </header>

    <form id="add-form" class="add-form" hidden>
      <label class="field">
        Name
        <span class="input-group">
          <span class="prefix">go/</span>
          <input id="add-name" type="text" placeholder="gh" autocomplete="off" required />
        </span>
      </label>
      <label class="field">
        URL
        <input id="add-url" class="input" type="url" placeholder="https://github.com" required />
      </label>
      <p id="add-error" class="error" hidden></p>
      <div class="form-actions">
        <button id="add-cancel" type="button" class="btn">Cancel</button>
        <button type="submit" class="btn btn-primary">
          <span data-icon="check"></span>Save
        </button>
      </div>
    </form>

    <div class="search">
      <span class="search-icon" data-icon="search"></span>
      <input id="search" class="input" type="search" placeholder="Search shortlinks..." autocomplete="off" />
    </div>

    <ul id="list" class="list" role="list"></ul>

    <section id="empty" class="empty-state" hidden>
      <div class="empty-mark" data-icon="bolt"></div>
      <h3>No shortlinks yet</h3>
      <p>Click <strong>Add</strong> to save your first one.</p>
    </section>

    <footer class="footer">
      <span id="count" class="muted-text"></span>
      <button id="open-manage" type="button" class="btn btn-ghost">
        Manage all <span data-icon="arrow"></span>
      </button>
    </footer>

    <script src="lib/storage.js"></script>
    <script src="lib/ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
